<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BODMAS Calculator</title>
<style>
  :root {
    --bg-color: #f3f4f6;
    --calc-bg: #1f2937;
    --screen-bg: #374151;
    --btn-bg: #4b5563;
    --btn-hover: #6b7280;
    --btn-accent: #3b82f6;
    --btn-accent-hover: #2563eb;
    --btn-clear: #ef4444;
    --btn-clear-hover: #dc2626;
    --text-color: #f9fafb;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background-color: var(--bg-color);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .calculator {
    background-color: var(--calc-bg);
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    width: 320px;
  }

  .screen {
    width: 100%;
    height: 80px;
    background-color: var(--screen-bg);
    border: none;
    border-radius: 8px;
    margin-bottom: 20px;
    color: var(--text-color);
    font-size: 2rem;
    text-align: right;
    padding: 10px;
    box-sizing: border-box;
    outline: none;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    background-color: var(--btn-bg);
    color: var(--text-color);
    border: none;
    border-radius: 8px;
    padding: 15px;
    font-size: 1.25rem;
    cursor: pointer;
    transition: background-color 0.2s;
  }

  button:hover {
    background-color: var(--btn-hover);
  }

  .operator {
    background-color: var(--btn-accent);
  }

  .operator:hover {
    background-color: var(--btn-accent-hover);
  }

  .clear {
    background-color: var(--btn-clear);
  }

  .clear:hover {
    background-color: var(--btn-clear-hover);
  }

  .equals {
    grid-column: span 2;
    background-color: var(--btn-accent);
  }
</style>
</head>
<body>

<div class="calculator">
  <input type="text" class="screen" id="display" disabled>
  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button class="operator" onclick="append('(')">(</button>
    <button class="operator" onclick="append(')')">)</button>
    <button class="operator" onclick="append('/')">÷</button>

    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button class="operator" onclick="append('*')">×</button>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button class="operator" onclick="append('-')">-</button>

    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button class="operator" onclick="append('+')">+</button>

    <button onclick="append('0')">0</button>
    <button onclick="append('.')">.</button>
    <button class="operator" onclick="append('^')">^</button>
    <button class="equals" onclick="calculate()">=</button>
  </div>
</div>

<script>
  const display = document.getElementById('display');
  
  // Tracks the raw equation for math logic
  let equation = "";

  function append(char) {
    // Determine what to show on screen vs what to calculate
    let displayChar = char;
    if (char === '*') displayChar = '×';
    if (char === '/') displayChar = '÷';
    
    display.value += displayChar;
    equation += char;
  }

  function clearDisplay() {
    display.value = "";
    equation = "";
  }

  function calculate() {
    try {
      if (!equation) return;
      
      // JavaScript uses ** for exponents, so we swap the ^ symbol before evaluating
      let mathToSolve = equation.replace(/\^/g, '**');
      
      // The Function constructor safely evaluates the math string
      let result = new Function('return ' + mathToSolve)();
      
      // Handle division by zero or malformed math
      if (!isFinite(result) || isNaN(result)) {
        display.value = "Error";
        equation = "";
      } else {
        // Round to avoid long floating point decimals (e.g., 0.1 + 0.2 = 0.30000000000000004)
        result = Math.round(result * 100000000) / 100000000;
        display.value = result;
        equation = result.toString();
      }
    } catch (error) {
      display.value = "Error";
      equation = "";
    }
  }
</script>

</body>
</html>
